# Metrics server: stub_status on a separate port for Prometheus scraping.
# Only /stub_status is exposed; nginx-prometheus-exporter scrapes this.
server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    location /stub_status {
        stub_status;
        allow 0.0.0.0/0;  # Docker network; restrict in production if needed
    }
}
