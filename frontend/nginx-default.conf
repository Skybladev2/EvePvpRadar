lua_shared_dict rl_store 20m;

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;
    server_tokens off;
    more_clear_headers Server;
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;
    error_page 403 = @forbidden;
    error_page 429 = @too_many_requests;

    # Proxy all requests to backend (HTML and API are served by backend)
    location / {
        access_by_lua_block {
            local function is_private_ip(ip)
                if not ip then return false end
                local a, b, c, d = ip:match("^(%d+)%.(%d+)%.(%d+)%.(%d+)$")
                if not a then return false end
                a, b, c, d = tonumber(a), tonumber(b), tonumber(c), tonumber(d)
                if a == 10 then return true end
                if a == 127 then return true end
                if a == 172 and b >= 16 and b <= 31 then return true end
                if a == 192 and b == 168 then return true end
                return false
            end

            local ua = ngx.var.http_user_agent
            local uri = ngx.var.uri
            if (not ua or ua == "") and not (uri == "/readyz" and is_private_ip(ngx.var.remote_addr)) then
                return ngx.exit(400)
            end

            local function env_num(name, default)
                local value = tonumber(os.getenv(name))
                if not value or value <= 0 then
                    return default
                end
                return value
            end

            local GLOBAL_RPS_LIMIT = env_num("RATELIMIT_GLOBAL_RPS", 400)
            local PER_IP_RPS_LIMIT = env_num("RATELIMIT_PER_IP_RPS", 5)
            local PER_IP_10S_LIMIT = env_num("RATELIMIT_PER_IP_10S", 30)
            local BLOCK_SECONDS = env_num("RATELIMIT_BLOCK_SEC", 3600)

            local dict = ngx.shared.rl_store
            local ip = ngx.var.binary_remote_addr or ngx.var.remote_addr
            local now = ngx.now()

            local block_key = "b:" .. ip
            local req_key = "r:" .. ip
            local global_key = "g:all"

            local blocked_until = dict:get(block_key)
            if blocked_until and blocked_until > now then
                ngx.header["Retry-After"] = tostring(math.ceil(blocked_until - now))
                return ngx.exit(403)
            end

            local graw = dict:get(global_key)
            local gkept = {}
            local gcount1 = 0
            if graw then
                for token in string.gmatch(graw, "[^,]+") do
                    local ts = tonumber(token)
                    if ts and (now - ts) <= 1 then
                        gkept[#gkept + 1] = ts
                        gcount1 = gcount1 + 1
                    end
                end
            end
            gkept[#gkept + 1] = now
            gcount1 = gcount1 + 1
            dict:set(global_key, table.concat(gkept, ","), 2)
            if gcount1 > GLOBAL_RPS_LIMIT then
                ngx.header["Retry-After"] = "1"
                return ngx.exit(429)
            end

            local raw = dict:get(req_key)
            local kept = {}
            local count1 = 0

            if raw then
                for token in string.gmatch(raw, "[^,]+") do
                    local ts = tonumber(token)
                    if ts and (now - ts) <= 10 then
                        kept[#kept + 1] = ts
                        if (now - ts) <= 1 then
                            count1 = count1 + 1
                        end
                    end
                end
            end

            kept[#kept + 1] = now
            local count10 = #kept
            count1 = count1 + 1

            if count10 > PER_IP_10S_LIMIT then
                dict:set(block_key, now + BLOCK_SECONDS, BLOCK_SECONDS)
                dict:delete(req_key)
                ngx.header["Retry-After"] = tostring(BLOCK_SECONDS)
                return ngx.exit(403)
            end

            dict:set(req_key, table.concat(kept, ","), 11)

            if count1 > PER_IP_RPS_LIMIT then
                ngx.header["Retry-After"] = "1"
                return ngx.exit(429)
            end
        }

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        # Advertise HTTP/3 (QUIC) when served over HTTPS (e.g. Yandex Cloud ALB terminates TLS)
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    location @forbidden {
        default_type text/plain;
        return 403 "Forbidden\n";
    }

    location @too_many_requests {
        default_type text/plain;
        return 429 "Too Many Requests\n";
    }
}
