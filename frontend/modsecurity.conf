# Block requests without User-Agent header.
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" "id:1000,phase:1,deny,status:400,log,msg:'Request Missing User-Agent Header'"

SecRuleEngine On
SecRequestBodyAccess On

# Load OWASP Core Rule Set (CRS).
Include /etc/nginx/modsecurity/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf

# Add request correlation in audit logs when enabled.
SecAuditEngine RelevantOnly
SecAuditLog /tmp/modsecurity_audit.log
SecAuditLogParts ABIJDEFHZ
