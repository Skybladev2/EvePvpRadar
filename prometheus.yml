global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend app metrics (port must match METRICS_PORT env)
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8081']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Frontend (nginx) metrics via nginx-prometheus-exporter
  - job_name: 'frontend'
    static_configs:
      - targets: ['nginx-exporter:9113']
    metrics_path: '/metrics'
    scrape_interval: 10s
